<!DOCTYPE html>
<html>

<style>
body {
  background: #0d0d0d;
  color: #eee;
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: url(Snake\ Xenzia.jpg);
  background-size: cover;
}

.hidden {
  display: none !important;
}

/* ── menu ── */

#menu {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

#menu h1 {
  font-size: 56px;
  letter-spacing: 4px;
  color: lime;
  margin: 0;
}

#menu p {
  color: #888;
  margin: 0;
}

#menu .buttons {
  display: flex;
  gap: 12px;
  margin-top: 12px;
}

.level-btn {
  padding: 14px 24px;
  font-size: 16px;
  background: #222;
  color: #eee;
  border: 1px solid #444;
  border-radius: 6px;
  cursor: pointer;
}

.level-btn:hover {
  background: #2a2a2a;
  border-color: lime;
  color: lime;
}

/* ── game ── */

#game {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#hud {
  display: flex;
  gap: 24px;
  align-items: center;
  padding: 8px 16px;
  background: #1a1a1a;
  border-radius: 6px;
  font-size: 14px;
  user-select: none;
 
}

#hud span {
  color: #ccc;
  user-select: none;

}

#hud span span {
  color: lime;
  font-weight: bold;
  user-select: none;

}

#menu-btn {
  padding: 6px 12px;
  background: #222;
  color: #eee;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
}

#menu-btn:hover {
  border-color: lime;
  color: lime;
}

/* ── board ── */

#board {
  display: grid;
  grid-template-columns: repeat(20, 24px);
  grid-template-rows: repeat(20, 24px);
  gap: 1px;
  background: #111;
  width: fit-content;
  border: 2px solid #333;
  border-radius: 4px;
  user-select: none;
}


#board-wrap {
  position: relative;
}

#gameover {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border-radius: 4px;
  user-select: none;
}

#gameover h2 {
  color: lime;
  font-size: 32px;
  margin: 0;
}

#gameover p {
  color: #ccc;
  margin: 0;
}

#gameover p span {
  color: lime;
  font-weight: bold;
}

#gameover button {
  padding: 10px 18px;
  font-size: 14px;
  background: #222;
  color: #eee;
  border: 1px solid #444;
  border-radius: 4px;
  cursor: pointer;
}

#gameover button:hover {
  border-color: lime;
  color: lime;
}


.cell     { background: #222; }
.snake { 
  background-color: #C1D82F; 
  border-radius: 2px; 
  transform: scale(0.7);
}
.food { 
  background-image: url('apple.png');
  background-size: cover;
  background-position: center;
  background-color: #222;

}

.poison { 
  background-image: url('poison_apple.png');
  background-size: cover;
  background-position: center;
  background-color: #222;

}

.obstacle { 
  background-image: url('wall.png');
  background-size: cover;
  background-position: center;

}

.snake-head { 
  background-image: url('snake-head.png');
  background-size: 100% 100%;
  background-position: center;
  transform: scale(1.25); 
  z-index: 10; 
}


.snake-head.right { transform: rotate(0deg); }
.snake-head.down  { transform: rotate(90deg); }
.snake-head.left  { transform: rotate(180deg); }
.snake-head.up    { transform: rotate(-90deg); }
  </style>
<head>
 
</head>
<body>

  <div id="menu">
    <h1>Snake Xenzia</h1>  
    <p>Choose a level</p>
    <div class="buttons">
      <button class="level-btn" data-level="1">Level 1</button>
      <button class="level-btn" data-level="2">Level 2</button>
      <button class="level-btn" data-level="3">Level 3</button> 
      <button class="level-btn" data-level="4">Level 4</button>
      <button class="level-btn" data-level="5">Level 5</button>

    </div>
  </div>

  <div id="game" class="hidden">
    <div id="hud">
      <span>Level: <span id="level">1</span></span>
      <span>Score: <span id="score">0</span></span>
      <button id="menu-btn">Menu</button>
      
    </div>

    <div id="board-wrap">
      <div id="board"></div>

      <div id="gameover" class="hidden">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <button id="retry-btn">Retry</button>
        <button id="to-menu-btn">Menu</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
